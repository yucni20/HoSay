<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HowSo">
<title>HowSo 好瘦生活</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 480px-max phone column; hero card, Today's Plan list, journey strip; fixed 5-tab bar; every log is a bottom sheet. */
:root{
  --cream:#F7F5F0;--paper:#FDFCF9;--sand:#E8E2D8;--hairline:#E3DDD2;
  --ink:#30312F;--ink-muted:#5F615A;--sage:#A8ADA3;--sage-deep:#5E6659;
  --clay:#C5795E;--clay-deep:#9A553F;--clay-soft:#F2E5DC;--on-clay:#FFFFFF;
  --scrim:rgba(48,49,47,.32);
  --shadow-card:0 1px 2px rgba(48,49,47,.04),0 10px 28px rgba(48,49,47,.05);
  --shadow-nav:0 -1px 0 rgba(48,49,47,.07);
  --font-sans:"Manrope","Noto Sans TC",system-ui,sans-serif;
  --font-cjk:"Noto Sans TC","Manrope",system-ui,sans-serif;
  --r-sm:10px;--r-md:18px;--r-lg:28px;--pill:999px;
  --dur-fast:160ms;--dur-base:280ms;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#1C1B19;--paper:#252421;--sand:#34312D;--hairline:#36332E;
  --ink:#EEEAE3;--ink-muted:#A9A69F;--sage:#7F857B;--sage-deep:#B4BBAE;
  --clay:#D48A6E;--clay-deep:#D48A6E;--clay-soft:#3A2B24;--on-clay:#1C1B19;
  --scrim:rgba(0,0,0,.55);--shadow-card:0 1px 2px rgba(0,0,0,.3);--shadow-nav:0 -1px 0 rgba(255,255,255,.05);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#1C1B19;--paper:#252421;--sand:#34312D;--hairline:#36332E;
  --ink:#EEEAE3;--ink-muted:#A9A69F;--sage:#7F857B;--sage-deep:#B4BBAE;
  --clay:#D48A6E;--clay-deep:#D48A6E;--clay-soft:#3A2B24;--on-clay:#1C1B19;
  --scrim:rgba(0,0,0,.55);--shadow-card:0 1px 2px rgba(0,0,0,.3);--shadow-nav:0 -1px 0 rgba(255,255,255,.05);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--cream)}
body{color:var(--ink);font:400 15px/22px var(--font-cjk);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--clay-deep);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.ov{font:700 11px/14px var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.h2{font-size:17px;line-height:24px;font-weight:600;margin:0}
.title{font-size:26px;line-height:32px;font-weight:600;margin:0;text-wrap:balance}
.unit{font:500 13px var(--font-sans);color:var(--ink-muted);margin-left:3px}
.muted{color:var(--ink-muted)}
.pos{color:var(--sage-deep)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:6px}
.brand .wm{font:700 18px/20px var(--font-sans);letter-spacing:.24em}
.brand .tg{font:500 12px/16px var(--font-sans);color:var(--ink-muted);letter-spacing:.02em;margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:600;font-size:15px}
.dateline{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px;gap:12px;flex-wrap:wrap}

/* screens */
.screen{display:flex;flex-direction:column;gap:16px;animation:rise var(--dur-base) ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-md);padding:20px}
.hero{border-radius:var(--r-lg);box-shadow:var(--shadow-card);border-color:transparent;padding:24px 22px}
.screen-h{padding-top:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* hero */
.wrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
.wbig{font:300 64px/1 var(--font-sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.wbig .unit{font-size:15px;letter-spacing:0;margin-left:6px}
.chart.spark{width:112px;height:44px;flex:none}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;padding-top:20px;border-top:1px solid var(--hairline)}
.ring{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring .rw{position:relative;width:128px;height:128px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--sand);stroke-width:8}
.ring .arc{fill:none;stroke:var(--clay);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 700ms cubic-bezier(.2,.7,.2,1)}
.ring .arc.p{stroke:var(--sage-deep)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .v{font:300 30px/34px var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.verdict{margin-top:18px;font-size:15px;line-height:23px}
.verdict b{font-weight:600}

/* list rows */
.list{padding:2px 18px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--hairline);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t>div:first-child{font-size:15px;line-height:22px}
.mark{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sage);display:grid;place-items:center;flex:none}
.mark svg{width:14px;height:14px;stroke:var(--paper);stroke-width:2.4;fill:none;opacity:0}
.mark.done{background:var(--sage-deep);border-color:var(--sage-deep)}
.mark.done svg{opacity:1}
.mark.part{border-color:var(--clay);background:conic-gradient(var(--clay-soft) var(--pct,0%),transparent 0)}
.chev{width:18px;height:18px;stroke:var(--sage);fill:none;stroke-width:1.8;flex:none}
.mini-btn{font:600 13px var(--font-sans);color:var(--clay-deep);padding:8px 12px;border-radius:var(--pill);background:var(--clay-soft);flex:none}
.pbar{height:6px;border-radius:var(--pill);background:var(--sand);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--clay);transition:width 700ms cubic-bezier(.2,.7,.2,1)}
.pbar.p i{background:var(--sage-deep)}

/* buttons */
.btn{font:600 15px/1 var(--font-cjk);border-radius:var(--pill);padding:15px 22px;background:var(--clay-deep);color:var(--on-clay);transition:transform var(--dur-fast),opacity var(--dur-fast);text-align:center}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.quiet{background:var(--sand);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--clay-deep);padding:10px 4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.link{font:600 14px var(--font-cjk);color:var(--clay-deep);padding:6px 0}

/* segmented & chips */
.seg{display:flex;background:var(--sand);border-radius:var(--pill);padding:4px;gap:2px}
.seg button{flex:1;white-space:nowrap;padding:9px 6px;border-radius:var(--pill);font-size:14px;font-weight:600;color:var(--ink-muted);transition:background var(--dur-fast)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(48,49,47,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px/1 var(--font-cjk);padding:11px 14px;border-radius:var(--pill);background:var(--sand);color:var(--ink);transition:transform var(--dur-fast)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--clay-soft);color:var(--clay-deep);box-shadow:inset 0 0 0 1.5px var(--clay-deep)}
.chip .num{font-weight:600}

/* stats grid */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hairline);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}
.stat{background:var(--paper);padding:16px 16px 14px;min-width:0}
.stat .v{font:300 28px/32px var(--font-sans);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .d{margin-top:4px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--clay);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--clay);opacity:.08}
.chart .goal{stroke:var(--sage);stroke-dasharray:3 4;stroke-width:1}
.chart .grid{stroke:var(--hairline);stroke-width:1}
.chart .dot{fill:var(--clay);stroke:var(--paper);stroke-width:2.5}
.chart .pt{fill:var(--paper);stroke:var(--clay);stroke-width:1.4}
.chart text{fill:var(--ink-muted);font:500 11px var(--font-sans)}
.chart .bar{fill:var(--sand)}
.chart .bar.on{fill:var(--clay)}

/* journey */
.jbar{height:6px;border-radius:var(--pill);background:var(--sand);overflow:hidden;margin:14px 0}
.jbar i{display:block;height:100%;background:var(--clay);border-radius:inherit}
.ms{display:flex;justify-content:space-between;gap:4px}
.ms .m{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:15px;color:var(--ink-muted);text-align:center;flex:1}
.ms .m b{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--sage)}
.ms .m.on b{background:var(--sage-deep);border-color:var(--sage-deep)}
.ms .m.cur b{background:var(--clay);border-color:var(--clay);box-shadow:0 0 0 4px var(--clay-soft)}
.ms .m.cur{color:var(--ink);font-weight:600}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.days .d{aspect-ratio:1;border-radius:8px;background:var(--sand);display:grid;place-items:center;font:600 11px var(--font-sans);color:var(--ink-muted);max-width:100%}
.days .d.l1{background:var(--clay-soft);color:var(--clay-deep)}
.days .d.l2{background:color-mix(in srgb,var(--clay) 55%,var(--paper));color:var(--ink)}
.days .d.l3{background:var(--clay);color:var(--on-clay)}
.days .d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.days .d.future{background:transparent;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--sage)}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left}
.trio .v{font:300 28px/32px var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}

/* leaderboard */
.lb .r{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--hairline)}
.lb .r:last-child{border-bottom:0}
.lb .rk{width:18px;font:600 14px var(--font-sans);color:var(--ink-muted);text-align:center;flex:none}
.lb .av{width:36px;height:36px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.lb .t{flex:1;min-width:0}
.lb .pts{font:500 20px var(--font-sans);font-variant-numeric:tabular-nums}
.lb .me{background:var(--clay-soft);border-radius:var(--r-sm);border-bottom-color:transparent}
.tag{display:inline-flex;align-items:center;font:600 11px/1 var(--font-sans);letter-spacing:.08em;padding:5px 8px;border-radius:var(--pill);background:var(--sand);color:var(--ink-muted)}
.tag.clay{background:var(--clay-soft);color:var(--clay-deep)}
.rules{display:grid;gap:10px;margin-top:4px}
.rules div{display:flex;justify-content:space-between;gap:12px;font-size:14px}

/* meals */
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal .it{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--hairline);align-items:center}
.meal .it:first-of-type{margin-top:10px}
.meal .it .nm{min-width:0;flex:1}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px;stroke:var(--sage);stroke-width:2;fill:none}
.macro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.macro .lab{display:flex;flex-direction:column;margin-bottom:8px;gap:2px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 20px}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--sage);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.empty .btn{margin-top:14px}

/* skeleton */
.sk{background:var(--sand);border-radius:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--clay-soft);border-radius:var(--r-sm);padding:10px 12px 10px 14px;margin-top:14px}
.banner .cap{color:var(--ink)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);box-shadow:var(--shadow-nav);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:14px;font-weight:600;color:var(--ink-muted);padding:4px 0}
.nav svg{width:24px;height:24px;fill:none;stroke:var(--sage);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--dur-fast)}
.nav button.on{color:var(--clay-deep)}
.nav button.on svg{stroke:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity var(--dur-base)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-card);
  max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;transform:translateY(102%);transition:transform var(--dur-base) cubic-bezier(.2,.8,.2,1);
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.show{transform:none}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--sand);margin:0 auto 16px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--ink-muted)}
.f input,.f select,.f textarea{width:100%;background:var(--cream);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font-family:var(--font-sans);outline:none;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--clay-deep);box-shadow:0 0 0 3px var(--clay-soft)}
.f .in-u{position:relative}
.f .in-u span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 13px var(--font-sans);color:var(--ink-muted);pointer-events:none}
.f .in-u input{padding-right:52px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{font-size:13px;line-height:19px;color:var(--ink-muted)}
.srch{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--hairline);border-radius:var(--r-sm)}
.srch button{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--hairline);text-align:left}
.srch button:last-child{border-bottom:0}
.srch button.on{background:var(--clay-soft)}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:12px 0;border-radius:var(--r-sm);background:var(--sand);font:600 15px var(--font-sans)}
.scale button.on{background:var(--clay-deep);color:var(--on-clay)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.sw{width:48px;height:28px;border-radius:var(--pill);background:var(--sand);position:relative;transition:background var(--dur-fast);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform var(--dur-fast)}
.sw.on{background:var(--clay-deep)}
.sw.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--cream);font-size:14px;font-weight:500;padding:11px 18px;border-radius:var(--pill);opacity:0;transition:all var(--dur-base);z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:28px;padding-bottom:28px}
.ob .steps{display:flex;gap:6px;margin-bottom:28px}
.ob .steps i{flex:1;height:3px;border-radius:2px;background:var(--sand)}
.ob .steps i.on{background:var(--clay)}
.ob .body{flex:1;display:flex;flex-direction:column;gap:18px}
.ob .foot{display:flex;gap:10px;margin-top:24px}
.ob .foot .btn{flex:1}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:12vh}
.welcome .wm{font:300 76px/.92 var(--font-sans);letter-spacing:-.045em}
.welcome .zh{font:500 15px var(--font-cjk);letter-spacing:.24em;color:var(--ink-muted);margin:14px 0 0 4px}
.welcome .lead{font-size:17px;line-height:27px;margin-top:40px;max-width:24em}
.welcome .arcs{width:100%;max-width:340px;height:auto;margin-top:36px}
.plan-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--hairline);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}
.plan-sum div{background:var(--paper);padding:16px 12px}
.plan-sum .v{font:300 26px/30px var(--font-sans);margin-top:4px;font-variant-numeric:tabular-nums}

/* supplements & report */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:2px 20px}
.cats::-webkit-scrollbar{display:none}
.chip.sm{padding:9px 12px;font-size:13px;white-space:nowrap;flex:none}
.srch button>span:first-child{overflow:hidden;text-overflow:ellipsis}
.pick{display:flex;flex-direction:column;gap:0;padding:16px;border-color:var(--clay-deep)}
.pick-sum{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin:18px 0 14px;padding-top:14px;border-top:1px solid var(--hairline)}
.dnav{display:flex;align-items:center;gap:4px;min-width:0}
.dnav .x{width:36px;height:36px}
.dnav .x[disabled]{opacity:.3}
.dpick{position:relative;display:inline-flex;align-items:center;gap:6px;font:600 17px/24px var(--font-cjk);padding:4px 6px;border-radius:var(--r-sm);cursor:pointer;min-width:0}
.dpick svg{width:18px;height:18px;stroke:var(--ink-muted);fill:none;stroke-width:1.6;flex:none}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.dpick:focus-within{outline:2px solid var(--clay-deep);outline-offset:2px}
.backfill{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--clay-soft);border-radius:var(--r-sm);padding:9px 10px 9px 14px}
.backfill .cap{color:var(--ink)}
.sh-date{display:flex;align-items:center;gap:8px;margin:-8px 0 16px;flex-wrap:wrap}
.sh-date input{background:var(--cream);border:1px solid var(--hairline);border-radius:var(--pill);padding:7px 12px;font:600 14px var(--font-sans);color:var(--ink)}
.sh-date .tag{cursor:pointer}
.yt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--cream);border:1px solid var(--hairline);text-decoration:none;color:var(--ink);margin-bottom:14px}
.yt .pl{width:34px;height:34px;border-radius:50%;background:var(--clay-deep);display:grid;place-items:center;flex:none}
.yt .pl svg{width:14px;height:14px;fill:var(--on-clay);stroke:none;margin-left:2px}
.yt .ex{width:16px;height:16px;stroke:var(--sage);fill:none;stroke-width:1.8;flex:none;margin-left:auto}
.yt .t{min-width:0}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--hairline);text-decoration:none;color:var(--ink);min-width:0;transition:transform var(--dur-fast)}
.vcard:active{transform:scale(.98)}
.vcard .pl{width:30px;height:30px;border-radius:50%;background:var(--clay-soft);display:grid;place-items:center}
.vcard .pl svg{width:12px;height:12px;fill:var(--clay-deep);stroke:none;margin-left:2px}
.vcard b{font-size:14px;line-height:20px;font-weight:600}
.stepper{display:flex;align-items:center;background:var(--sand);border-radius:var(--pill);padding:4px}
.stepper button{width:44px;height:40px;border-radius:var(--pill);font:500 22px/1 var(--font-sans);display:grid;place-items:center;transition:background var(--dur-fast)}
.stepper button:active{background:var(--paper)}
.stepper .q{min-width:76px;text-align:center;font:600 18px var(--font-sans);font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tgrid .chip{padding:12px 2px;text-align:center;font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp{padding:2px 18px}
.cmp .r{display:grid;grid-template-columns:minmax(0,1fr) auto 72px;gap:10px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.cmp .r:last-child{border-bottom:0}
.cmp .r.hd{font-size:12px;color:var(--ink-muted);font-weight:600;padding:12px 0 8px}
.cmp .ba{font:500 13px var(--font-sans);color:var(--ink-muted)}
.cmp .dd{font:600 14px var(--font-sans);text-align:right}
.hl{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.hl li{display:flex;gap:12px;font-size:15px;line-height:23px}
.hl li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--clay);margin-top:9px;flex:none}
.back{display:inline-flex;align-items:center;gap:2px;font:600 14px var(--font-cjk);color:var(--ink-muted);padding:6px 0;margin-left:-4px}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.sw-row{display:flex;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.wbig{font-size:54px}.ring .rw{width:110px;height:110px}.ring .v{font-size:26px}}
</style>

function weightRate(){
  const s=weightSeries().filter(p=>diffDays(p.date,today())<=14);
  if(s.length<4||diffDays(s[0].date,s[s.length-1].date)<7)return null;
  const xs=s.map(p=>diffDays(s[0].date,p.date)),ys=s.map(p=>p.v),n=s.length;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
  return den?-(num/den)*7:null; // kg lost per week (positive = losing)
}
function weekKey(){return S.profile?"w"+Math.floor((planDay()-1)/7):"w0"}
function suggestion(){
  if(!S.profile||planDay()<8)return null;
  if(S.adjSkip[weekKey()])return null;
  const t=targets(),rate=weightRate();
  const f=firstOf(S.inbody),l=lastOf(S.inbody);
  if(f&&l&&f!==l&&f.smm&&l.smm&&l.smm-f.smm<=-0.3)
    return {k:"muscle",title:"骨骼肌下降了 "+nf(f.smm-l.smm,1)+" kg",body:"減脂時要保住肌肉。建議蛋白質提高 10 g，並維持每週 2 次力量訓練。",change:{protein:10},cta:"蛋白質 +10 g"};
  if(rate==null)return null;
  if(rate<0.2){
    if(t.kcal-100>=Math.max(t.bmr,1200))return {k:"slow",title:"近兩週每週約 "+(rate<0?"增加 "+nf(-rate,2):"減少 "+nf(rate,2))+" kg",body:"進度比預期慢。建議每日熱量減少 100 kcal，改為 "+nf(t.kcal-100)+" kcal。",change:{kcal:-100},cta:"熱量 −100 kcal"};
    return {k:"slow-steps",title:"近兩週每週約減少 "+nf(Math.max(rate,0),2)+" kg",body:"熱量已接近基礎代謝，不建議再少吃。改為每天多走 2,000 步。",change:{steps:2000},cta:"步數 +2,000"};
  }
  if(rate>1.0)return {k:"fast",title:"近兩週每週約減少 "+nf(rate,2)+" kg",body:"速度偏快，容易流失肌肉。建議每日熱量增加 150 kcal。",change:{kcal:150},cta:"熱量 +150 kcal"};
  return null;
}
function firstLastMeasure(k){const a=sortD(S.measures.filter(m=>m[k]));return [a[0]||null,a[a.length-1]||null]}
function myScore(){
  if(!S.profile)return {total:0,w:0,f:0,ws:0,log:0,wPct:0,pbfD:0,waistD:0};
  const sw=startW(),cw=curW();const wPct=sw&&cw?(sw-cw)/sw*100:0;
  const fi=firstOf(S.inbody),li=lastOf(S.inbody);const pbfD=fi&&li&&fi.pbf&&li.pbf?fi.pbf-li.pbf:0;
  const [fm,lm]=firstLastMeasure("waist");const waistD=fm&&lm?fm.waist-lm.waist:0;
  let log=0;const n=Math.min(planDay(),30);for(let i=0;i<n;i++)log+=dayLevel(addDays(S.profile.startDate,i));
  const w=Math.max(0,wPct*10),f=Math.max(0,pbfD*10),ws=Math.max(0,waistD*5);
  return {total:Math.round(w+f+ws+log),w:Math.round(w),f:Math.round(f),ws:Math.round(ws),log,wPct,pbfD,waistD};
}

/* ---------- charts ---------- */
function lineChart(pts,{w=320,h=150,goal=null,unit="",dec=1}={}){
  if(!pts.length)return "";
  const padL=6,padR=40,padT=14,padB=22;
  const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const span=Math.max(hi-lo,1);lo-=span*.15;hi+=span*.15;
  const d0=pts[0].date,dn=pts[pts.length-1].date,days=Math.max(diffDays(d0,dn),1);
  const X=d=>padL+(diffDays(d0,d)/days)*(w-padL-padR),Y=v=>padT+(1-(v-lo)/(hi-lo))*(h-padT-padB);
  const path=pts.map(p=>X(p.date).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  let g="";
  if(goal!=null){const gy=Y(goal);g=`<line x1="${padL}" x2="${w-padR}" y1="${gy}" y2="${gy}" class="goal"/><text x="${w-padR+6}" y="${gy+4}">目標</text>`}
  const area=pts.length>1?`<polygon class="ar" points="${X(d0)},${h-padB} ${path} ${X(dn)},${h-padB}"/>`:"";
  const dots=pts.length<=16?pts.slice(0,-1).map(p=>`<circle class="pt" cx="${X(p.date)}" cy="${Y(p.v)}" r="2.2"/>`).join(""):"";
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="趨勢圖，最新 ${nf(last.v,dec)} ${unit}">
   <line x1="${padL}" x2="${w-padR}" y1="${h-padB}" y2="${h-padB}" class="grid"/>${g}${area}
   <polyline class="ln" points="${path}"/>${dots}<circle class="dot" cx="${X(dn)}" cy="${Y(last.v)}" r="4.5"/>
   <text x="${Math.min(X(dn)+8,w-padR+6)}" y="${Y(last.v)+4}" style="fill:var(--ink);font-weight:600">${nf(last.v,dec)}</text>
   <text x="${padL}" y="${h-6}">${md(d0)}</text><text x="${w-padR}" y="${h-6}" text-anchor="end">${md(dn)}</text></svg>`;
}
function spark(pts){
  if(pts.length<2)return "";
  const w=112,h=44,vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<.4){hi+=.2;lo-=.2}
  const X=i=>4+i/(pts.length-1)*(w-10),Y=v=>5+(1-(v-lo)/(hi-lo))*(h-10);
  return `<svg class="chart spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline class="ln" points="${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")}"/><circle class="dot" cx="${X(pts.length-1)}" cy="${Y(vs[vs.length-1])}" r="3.5"/></svg>`;
}
function ring(val,target,label,cls=""){
  const C=2*Math.PI*52,pct=target?clamp(val/target,0,1):0;
  return `<div class="ring"><div class="rw"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="arc ${cls}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C*(1-pct)).toFixed(1)}"/></svg>
  <div class="mid"><div class="v">${nf(val)}</div><div class="cap num">/ ${nf(target)}${label.u}</div></div></div><div class="cap">${label.t}</div></div>`;
}
function weekBars(){
  const t=today();const w=300,h=110,bw=26;let out="";
  for(let i=6;i>=0;i--){const d=addDays(t,-i),x=dayData(d),idx=6-i;const max=60;const bh=Math.max(3,clamp(x.actMin/max,0,1)*(h-34));
    const cx=14+idx*((w-28)/6);
    out+=`<rect class="bar ${x.actMin>=20?"on":""}" x="${cx-bw/2}" y="${h-20-bh}" width="${bw}" height="${bh}" rx="6"/><text x="${cx}" y="${h-4}" text-anchor="middle">${i===0?"今天":WD[parse(d).getDay()]}</text>${x.actMin?`<text x="${cx}" y="${h-26-bh}" text-anchor="middle">${x.actMin}</text>`:""}`;
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="近 7 天活動分鐘">${out}</svg>`;
}

function cycleRange(){const st=S.profile.startDate,end=addDays(st,29),last=today()<end?today():end;return {st,end,last,n:Math.max(diffDays(st,last)+1,1),done:today()>=end}}
function pickBefore(arr,st){const a=sortD(arr);return a.filter(r=>r.date<=st).pop()||a.find(r=>r.date>=st)||null}
function pickAfter(arr,b,st,last){const a=sortD(arr).filter(r=>r.date>=st&&r.date<=last).pop()||null;return a&&b&&a.id!==b.id&&a.date>b.date?a:null}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function cmpRow(lab,b,a,u,dec,dir){const ok=v=>v!=null&&v!==""&&!isNaN(v);const d=ok(b)&&ok(a)?a-b:null;const good=d!=null&&(dir==="down"?d<0:d>0);
  return `<div class="r"><span>${lab}</span><span class="ba num">${ok(b)?nf(b,dec):"—"} → ${ok(a)?nf(a,dec):"—"}</span><span class="dd num ${good?"pos":""}">${d!=null?sgn(d,dec)+(u?" "+u:""):"—"}</span></div>`}
function cycleStats(){
  const C=cycleRange(),days=[...Array(C.n)].map((_,i)=>addDays(C.st,i)),dd=days.map(d=>({d,x:dayData(d),t:targets(d)}));
  const ws=weightSeries(),wb=ws.filter(p=>p.date<=C.st).pop()||ws.find(p=>p.date>=C.st)||null,wa0=ws.filter(p=>p.date>=C.st&&p.date<=C.last).pop()||null,wa=wa0&&wb&&wa0.date>wb.date?wa0:null;
  const ib0=pickBefore(S.inbody,C.st),ib1=pickAfter(S.inbody,ib0,C.st,C.last),m0=pickBefore(S.measures,C.st),m1=pickAfter(S.measures,m0,C.st,C.last);
  const mealD=dd.filter(z=>z.x.meals.length);
  const logs=S.suppLog.filter(l=>l.date>=C.st&&l.date<=C.last),prod={};
  logs.forEach(l=>{const k=l.name;const p=prod[k]||(prod[k]={name:l.name,unit:l.unit,qty:0,days:new Set(),tm:{}});p.qty+=+l.qty||0;p.days.add(l.date);p.tm[l.timing]=(p.tm[l.timing]||0)+1});
  const hs=dd.map(z=>S.health[z.d]).filter(Boolean),ev=hs.map(h=>h.energy).filter(Boolean),en=k=>ev.length>=2?avg(k==="a"?ev.slice(0,Math.min(7,Math.ceil(ev.length/2))):ev.slice(-Math.min(7,Math.floor(ev.length/2)))):null;
  const bow=hs.filter(h=>h.bowel);
  return {C,days,dd,wb,wa,ib0,ib1,m0,m1,
    logged:days.filter(anyLog).length,full:days.filter(d=>dayLevel(d)===3).length,
    avgK:mealD.length?Math.round(avg(mealD.map(z=>z.x.kcal))):null,avgT:Math.round(avg(dd.map(z=>z.t.kcal))),
    protHit:dd.filter(z=>z.x.p>=z.t.protein*.9).length,waterHit:dd.filter(z=>z.x.water>=z.t.water*.9).length,
    actMin:dd.reduce((s,z)=>s+z.x.actMin,0),actDays:dd.filter(z=>z.x.actMin>=15).length,
    avgSteps:avg(dd.filter(z=>z.x.steps).map(z=>z.x.steps)),
    suppDays:new Set(logs.map(l=>l.date)).size,prod:Object.values(prod).sort((a,b)=>b.days.size-a.days.size),
    sleep:avg(hs.filter(h=>h.sleep).map(h=>+h.sleep)),e0:en("a"),e1:en("z"),bowelPct:bow.length?Math.round(bow.filter(h=>h.bowel==="y").length/bow.length*100):null};
}
function screenReport(){
  const R=cycleStats(),{C,wb,wa,ib0,ib1,m0,m1}=R,n=C.n;
  const wd=wb&&wa?wa.v-wb.v:null;
  const H=[];

const ALIAS={"珍奶":"珍珠","奶綠":"奶茶","雞蛋":"蛋","沙西米":"生魚片","刺身":"生魚片","壽司":"壽司","意大利粉":"義大利麵","意粉":"義大利麵","薯仔":"馬鈴薯","土豆":"馬鈴薯","粟米":"玉米","西紅柿":"番茄","蕃茄":"番茄","豬扒":"豬排","雞扒":"雞排","牛扒":"牛排","手搖":"手搖飲","蛋撻":"撻","麥當勞":"速食","肯德基":"速食","摩斯":"漢堡","便利店":"超商","7-11":"超商","全家":"超商","鐵板":"鐵板麵","麵包":"麵包","瓜":"瓜","牛":"牛","豬":"豬"};
const normQ=t=>t.replace(/[()（）\s・·]/g,"").toLowerCase();
function foodMatch(f,q){const n=normQ(f.n),c=f.cat,qq=normQ(q);if(n.includes(qq)||c.includes(qq))return true;const al=ALIAS[qq];return !!al&&(n.includes(al)||c.includes(al))}
function allFoods(){return S.foods.map((f,i)=>({id:"m"+i,n:f.name,u:f.portion||"1 份",k:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,cat:"我的食物",s:null,nok:f.kcal==null||f.kcal===""})).concat(FOODS)}
function foodList(cat,q){
  const all=allFoods();q=(q||"").trim();
  let list=q?all.filter(f=>foodMatch(f,q)).map(f=>[f,(f.cat.includes(q)?0:normQ(f.n).startsWith(normQ(q))?1:2)]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]):cat==="常用"?S.foods.length?all.filter(f=>f.cat==="我的食物").slice(0,6).concat(COMMON.map(n=>FOODS.find(f=>f.n===n)).filter(Boolean)):COMMON.map(n=>FOODS.find(f=>f.n===n)).filter(Boolean):all.filter(f=>f.cat===cat);
  list=list.slice(0,160);
  if(!list.length)return `<div class="hint" style="padding:14px">找不到「${esc(q)}」，在下方輸入名稱就能加入，熱量不知道可以先空著。</div>`;

}
function pickCalc(){

  const pick=n=>FOODS.find(f=>f.n===n);
  const menus=[["早餐",["無糖豆漿","茶葉蛋","地瓜"]],["午餐",["雞腿便當"]],["點心",["希臘優格"]],["晚餐",["鮭魚","燙青菜","糙米飯"]]];
  const menus2=[["早餐",["燕麥片","鮮乳","香蕉"]],["午餐",["雞肉沙拉","鮪魚飯糰"]],["晚餐",["板豆腐","雞胸肉","燙青菜"]]];
  for(let i=0;i<=11;i++){const d=addDays(st,i);const mm=i%2?menus2:menus;
    mm.forEach(([slot,items],si)=>{if(i===11&&si>1)return;items.forEach(n=>{const f=pick(n);s.meals.push({id:uid(),date:d,slot,name:f.n,portion:f.u,kcal:f.k,p:f.p,c:f.c,f:f.f})})});
    const pw=WEEK[i%7];if(i<11&&i!==6&&i!==3)s.acts.push({id:uid(),date:d,type:pw.type,min:pw.min,kcal:Math.round((ACTS.find(a=>a[0]===pw.type)||[0,4])[1]*59.5*pw.min/60)});
    s.water[d]=i===11?1000:[1800,2100,1600,2250,2000,1900,2300,1700,2150,2050,2200][i];
    s.steps[d]=i===11?3200:[6400,7200,5100,8300,8800,7600,6900,9100,8400,7700,8600][i];
    if(i<11)s.health[d]={sleep:[6.5,7,7.5,6,7,8,7,6.5,7,7.5,7][i],energy:[3,3,4,3,4,4,4,3,4,5,4][i],bowel:i%3?"y":"n",period:false,note:""};
  }
  const SL=[["s6",1,"睡醒"],["s1",1,"早餐前"],["s4",1,"午餐前"],["s3",2,"晚餐前"],["s5",1,"晚餐後"],["s2",2,"睡前"]];
  for(let i=0;i<=11;i++){const d=addDays(st,i);SL.forEach(([sid,q,tm],k)=>{if(i===11&&k>1)return;if((k===2&&i%3===2)||(k===4&&i%2)||(k===5&&i%4===3))return;const p=s.supps.find(x=>x.id===sid);
    s.suppLog.push({id:uid(),date:d,time:["07:05","08:20","11:50","18:10","19:40","22:30"][k],sid,name:p.name,unit:p.unit,qty:q,timing:tm})})}
  s.supps.find(x=>x.id==="s1").daily=1;s.supps.find(x=>x.id==="s6").daily=1;
  return s;
}

S=load();
applyTheme();
if(S&&S.profile){app.innerHTML=skeleton();setTimeout(render,420)}else{S=S||blank();render()}
})();
