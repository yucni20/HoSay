<title>今天吃了嗎？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>:root {
  --cream: #FBF8F1;
  --card: #FFFDF8;
  --sage: #8FA98A;
  --sage-deep: #4F6B4C;
  --sage-soft: #E4ECDF;
  --sage-mist: #F1F5EE;
  --blush: #F2CBC5;
  --blush-deep: #C77F76;
  --blush-soft: #FBECE8;
  --honey: #E9CB8B;
  --honey-soft: #FBF1DC;
  --ink: #33402F;
  --ink-2: #6E7868;
  --ink-3: #A3A99C;
  --line: #ECE6D9;
  --shadow: 0 10px 24px -16px rgba(79, 107, 76, .45);
  --font: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
body { min-height: 100dvh; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; border-radius: 10px; }
img { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- 版面 ---------- */
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: 0 18px calc(var(--nav-h) + var(--safe-b) + 28px); position: relative; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }

.topbar { padding: calc(env(safe-area-inset-top, 0px) + 22px) 2px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 26px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: .02em; }
.topbar .sub { color: var(--ink-2); font-size: 14px; margin: 2px 0 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--sage-deep); background: var(--sage-mist); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- 底部導覽 ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255, 253, 248, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.nav-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); text-decoration: none; font-size: 12px; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--sage-deep); }
.nav a[aria-current="page"] .nav-ico { background: var(--sage-soft); }
.nav-ico { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }

/* ---------- 卡片與按鈕 ---------- */
.card { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); border: 1px solid rgba(236, 230, 217, .7); }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .12s, background .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--sage-deep); color: #fff; }
.btn-soft { background: var(--sage-soft); color: var(--sage-deep); }
.btn-blush { background: var(--blush-soft); color: var(--blush-deep); }
.btn-ghost { color: var(--ink-2); padding: 0 12px; }
.btn-block { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.link { color: var(--sage-deep); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

.banner { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; margin-top: 14px; background: var(--honey-soft); color: #6E5420; font-size: 14px; }
.banner b { display: block; font-size: 15px; color: #5A4317; }
.banner .btn { margin-left: auto; min-height: 38px; padding: 0 14px; font-size: 14px; background: #fff; color: #6E5420; }
.banner.sage { background: var(--sage-mist); color: var(--sage-deep); }
.banner.sage b { color: var(--sage-deep); }

/* ---------- 今日小芽 ---------- */
.sprout-card { margin-top: 16px; display: grid; grid-template-columns: 112px 1fr; gap: 6px 14px; align-items: center; background: linear-gradient(160deg, #FFFDF8 30%, var(--sage-mist)); }
.sprout { width: 112px; height: 112px; }
.sprout-card h2 { margin: 0; font-size: 18px; line-height: 1.35; }
.sprout-card p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.progress { grid-column: 1 / -1; height: 10px; border-radius: 6px; background: var(--sage-soft); overflow: hidden; margin-top: 6px; }
.progress span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--sage), var(--sage-deep)); transition: width .5s cubic-bezier(.3, 1.3, .5, 1); }
.progress-meta { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.grow { transform-origin: 56px 92px; animation: grow .6s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes grow { from { transform: scale(.6); opacity: .4; } }

/* ---------- 時段與劑次 ---------- */
.slot { margin-top: 26px; }
.slot-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; }
.slot-head h3 { margin: 0; font-size: 17px; }
.slot-head .slot-ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.slot-head .count { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.slot-ico svg { width: 18px; height: 18px; }
.slot-morning .slot-ico { background: var(--honey-soft); color: #B98A2E; }
.slot-noon .slot-ico { background: var(--blush-soft); color: var(--blush-deep); }
.slot-evening .slot-ico { background: var(--sage-soft); color: var(--sage-deep); }
.slot-bedtime .slot-ico { background: #ECE9F4; color: #6F6890; }

.dose { display: grid; grid-template-columns: 56px 1fr auto; gap: 4px 14px; align-items: center; padding: 14px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); border: 1px solid rgba(236, 230, 217, .7); margin-bottom: 10px; transition: background .3s, opacity .3s; }
.dose + .dose { margin-top: 0; }
.thumb { width: 56px; height: 56px; border-radius: 18px; object-fit: cover; background: var(--sage-mist); display: grid; place-items: center; color: var(--sage); overflow: hidden; }
.thumb svg { width: 30px; height: 30px; }
.thumb.medicine { background: var(--blush-soft); color: var(--blush-deep); }
.thumb.other { background: var(--honey-soft); color: #B98A2E; }
.dose-name { font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.dose-meta { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.dose-time { font-weight: 700; color: var(--sage-deep); font-size: 15px; align-self: start; padding-top: 2px; font-variant-numeric: tabular-nums; }
.dose-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 10px; }
.dose-actions .btn { flex: 1; min-height: 42px; padding: 0 10px; font-size: 14px; }
.dose-actions .btn-primary { flex: 1.5; }
.dose-status { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 8px 12px; border-radius: 14px; font-size: 14px; }
.dose.is-taken { background: var(--sage-mist); box-shadow: none; }
.dose.is-taken .dose-status { background: #fff; color: var(--sage-deep); }
.dose.is-skipped { background: #F6F4EE; box-shadow: none; }
.dose.is-skipped .dose-status { background: #fff; color: var(--ink-2); }
.dose.is-skipped .dose-name { color: var(--ink-2); }
.dose.is-snoozed .dose-status { background: var(--honey-soft); color: #6E5420; }
.dose-status .btn { min-height: 32px; padding: 0 12px; font-size: 13px; }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 8px; font-size: 12px; background: var(--honey-soft); color: #7A5D22; }
.tag.blush { background: var(--blush-soft); color: var(--blush-deep); }
.tag.mute { background: #F1EEE6; color: var(--ink-2); }
.due { color: var(--blush-deep); font-weight: 600; }

/* ---------- 空狀態 ---------- */
.empty { text-align: center; padding: 34px 18px 10px; color: var(--ink-2); }
.empty svg { width: 150px; height: 120px; margin: 0 auto 6px; display: block; }
.empty h2 { color: var(--ink); font-size: 19px; margin: 6px 0 6px; }
.empty p { margin: 0 0 18px; font-size: 15px; }

/* ---------- 日曆 ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 10px; }
.cal-head h2 { margin: 0; font-size: 19px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--ink-3); padding: 4px 0; }

/* ---------- 項目列表 ---------- */

/* ---------- 表單 ---------- */

.time-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }

/* ---------- 設定 ---------- */
.group { margin-top: 18px; }

.diag { list-style: none; padding: 0; margin: 4px 0 6px; font-size: 14px; }

.diag .ok { color: var(--sage-deep); }
.diag .no { color: var(--blush-deep); }
.diag .ic { width: 20px; flex: none; text-align: center; font-weight: 700; }
.steps { padding-left: 0; list-style: none; counter-reset: s; margin: 8px 0 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 8px 0; font-size: 15px; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--sage-soft); color: var(--sage-deep); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.steps svg { width: 18px; height: 18px; vertical-align: -3px; color: #2F7BF6; }

/* ---------- 底部抽屜 ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(51, 64, 47, .32); animation: fade .2s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; background: var(--cream); border-radius: 28px 28px 0 0; max-height: 92dvh; display: flex; flex-direction: column; animation: up .3s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 40px -20px rgba(0, 0, 0, .3); }
@keyframes up { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 8px; position: relative; }
.sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); }
.sheet-head h2 { margin: 14px 0 0; font-size: 19px; }
.sheet-body { overflow-y: auto; padding: 8px 18px calc(var(--safe-b) + 22px); -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: 12px 18px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); background: var(--cream); display: flex; gap: 10px; }
.sheet-foot .btn { flex: 1; min-height: 50px; }
.action-list { display: flex; flex-direction: column; gap: 8px; }
.action-list .btn { justify-content: flex-start; min-height: 52px; border-radius: 16px; padding: 0 16px; }

/* ---------- 提示 ---------- */
.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; background: var(--ink); color: #fff; padding: 10px 10px 10px 18px; border-radius: 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; animation: up2 .25s ease; max-width: 520px; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .5); }
.toast.err { background: #8A4C45; }
.toast .btn { min-height: 34px; padding: 0 14px; background: rgba(255, 255, 255, .16); color: #fff; font-size: 13px; }
.toast:not(:has(.btn)) { padding-right: 18px; }
@keyframes up2 { from { transform: translateY(14px); opacity: 0; } }

/* ---------- 完成慶祝 ---------- */
.celebrate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(251, 248, 241, .88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .3s ease; padding: 24px; }
.celebrate-inner { text-align: center; max-width: 320px; }
.celebrate svg { width: 200px; height: 200px; }
.celebrate h2 { margin: 6px 0 6px; font-size: 22px; }
.celebrate p { margin: 0 0 22px; color: var(--ink-2); }
.petals { transform-origin: 100px 92px; animation: bloom 1s cubic-bezier(.3, 1.5, .5, 1) .15s both; }
@keyframes bloom { from { transform: rotate(-40deg) scale(0); } }
.float { animation: floaty 2.4s ease-in-out infinite alternate; }
@keyframes floaty { to { transform: translateY(-6px); } }
.spark { animation: spark 1.4s ease-out both; }
@keyframes spark { 0% { opacity: 0; transform: scale(.2); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }

/* ---------- 登入 ---------- */
.auth { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 36px) 22px 40px; }
.auth-hero { text-align: center; margin-bottom: 18px; }
.auth-hero svg { width: 160px; height: 140px; }
.auth-hero h1 { margin: 4px 0 4px; font-size: 30px; letter-spacing: .04em; }
.auth-hero p { margin: 0; color: var(--ink-2); }
.privacy-note { font-size: 13px; color: var(--ink-2); text-align: center; margin-top: 18px; line-height: 1.7; }

.boot { min-height: 100dvh; display: grid; place-items: center; color: var(--sage); }

@media (min-width: 720px) {
  .topbar h1 { font-size: 30px; }
  .app { padding-left: 24px; padding-right: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

body:has(.fab) .toast-wrap { bottom: calc(var(--nav-h) + var(--safe-b) + 86px); }

.preview-bar { background: var(--sage-deep); color: #fff; font-family: var(--font); font-size: 13px; line-height: 1.5;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.preview-bar button { color: #fff; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
</style>

<body>
<div class="preview-bar" role="note"><span>預覽版・示範資料，不會發送通知</span><button type="button" id="preview-reset">重設示範資料</button></div>
<div id="root"><div class="boot" aria-live="polite">載入中…</div></div>
<script>// 預覽版用：在瀏覽器內模擬後端 API（規則與正式版 lib/service.js 相同），資料存在這台裝置的瀏覽器
(function () {
  const KEY = 'chile-ma-preview-v1';
  const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei';

  // ---- 排程規則（同 lib/schedule.js）----
  const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + 'T00:00:00Z'));
  const isTime = (s) => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
  const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  const dow = (d) => new Date(d + 'T00:00:00Z').getUTCDay();
  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function localNow(tz) {
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    const g = (t) => p.find((x) => x.type === t).value;
    return { date: `${g('year')}-${g('month')}-${g('day')}`, minutes: +g('hour') * 60 + +g('minute') };
  }
  function slotOf(t) { const m = toMin(t); if (m >= 300 && m < 660) return 'morning'; if (m >= 660 && m < 960) return 'noon'; if (m >= 960 && m < 1260) return 'evening'; return 'bedtime'; }
  function occursOn(m, d) {
    if (!m.start_date || d < m.start_date) return false;
    if (m.end_date && d > m.end_date) return false;
    if (m.deleted_date && d >= m.deleted_date) return false;
    if (m.paused_since && d >= m.paused_since) return false;
    if (m.freq_type === 'daily') return true;
    if (m.freq_type === 'weekly') return (m.weekdays || []).includes(dow(d));
    if (m.freq_type === 'interval') return daysBetween(m.start_date, d) % (m.interval_days || 1) === 0;
    return false;
  }
  function dosesWithHistory(meds, date, logs) {
    const out = [];
    for (const med of meds) if (occursOn(med, date)) for (const time of med.times) out.push({ med, time, slot: slotOf(time) });
    const seen = new Set(out.map((x) => `${x.med.id}|${x.time}`));
    for (const l of logs) {
      const k = `${l.med_id}|${l.time}`; const med = meds.find((m) => m.id === l.med_id);
      if (!seen.has(k) && med) { seen.add(k); out.push({ med, time: l.time, slot: slotOf(l.time) }); }
    }
    return out.sort((a, b) => a.time.localeCompare(b.time) || a.med.name.localeCompare(b.med.name));
  }

  // ---- 資料 ----
  function seed() {
    const today = localNow(TZ).date;
    const start = addDays(today, -24);
    const meds = [
      { id: 1, name: '維他命 D', category: 'supplement', dose_amount: 1, dose_unit: '顆', times: ['08:00'], note: '飯後', stock: 11, restock_threshold: 10 },
      { id: 2, name: '魚油', category: 'supplement', dose_amount: 2, dose_unit: '粒', times: ['08:00', '20:00'], note: '隨餐', stock: null, restock_threshold: null },
      { id: 3, name: '血壓藥', category: 'medicine', dose_amount: 1, dose_unit: '錠', times: ['12:30'], note: '飯後', stock: 26, restock_threshold: 7 },
      { id: 4, name: '益生菌', category: 'other', dose_amount: 1, dose_unit: '包', times: ['22:00'], note: '空腹', stock: null, restock_threshold: null, freq_type: 'weekly', weekdays: [1, 3, 5] },
    ].map((m) => ({ photo: null, freq_type: 'daily', weekdays: null, interval_days: null, start_date: start, end_date: null, notify: true, paused_since: null, deleted_date: null, ...m }));
    const logs = [];
    let r = 7;
    const rand = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    for (let d = start; d < today; d = addDays(d, 1)) {
      for (const x of dosesWithHistory(meds, d, [])) {
        const v = rand();
        if (v < 0.8) logs.push({ med_id: x.med.id, date: d, time: x.time, status: 'taken', taken_at: x.time });
        else if (v < 0.88) logs.push({ med_id: x.med.id, date: d, time: x.time, status: 'skipped', taken_at: null });
      }
    }
    return { loggedIn: true, user: { email: 'demo@example.com', display_name: 'Jaynie' },
      settings: { timezone: TZ, repeat_minutes: 15, repeat_count: 2, hide_names: 0 }, meds, logs, snoozes: [], nextId: 5 };
  }
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  if (!db) db = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* 無法儲存時只保留在記憶體 */ } };
  document.addEventListener('click', (e) => { if (e.target.id === 'preview-reset') window.__previewReset(); });
  window.__previewReset = () => { db = seed(); save(); location.hash = '#/today'; location.reload(); };

  class E extends Error { constructor(s, m) { super(m); this.status = s; } }
  const bad = (m) => new E(400, m);
  const today = () => localNow(db.settings.timezone);
  const pub = (m) => ({ ...m, paused: !!m.paused_since, low_stock: m.stock != null && m.restock_threshold != null && m.stock <= m.restock_threshold });
  const getMed = (id, incDel) => { const m = db.meds.find((x) => x.id === Number(id)); if (!m || (!incDel && m.deleted_date)) throw new E(404, '找不到這個項目'); return m; };

  function validate(b) {
    const name = String(b.name ?? '').trim();
    if (!name) throw bad('請輸入名稱');
    if (name.length > 40) throw bad('名稱最多 40 字');
    const amt = b.dose_amount === '' || b.dose_amount == null ? null : Number(b.dose_amount);
    if (amt !== null && (!isFinite(amt) || amt <= 0)) throw bad('每次用量需為正數');
    if (!Array.isArray(b.times) || !b.times.length) throw bad('請至少設定一個服用時間');
    const times = [...new Set(b.times)].sort();
    if (!times.every(isTime)) throw bad('時間格式需為 HH:MM');
    let weekdays = null, interval_days = null;
    if (b.freq_type === 'weekly') { if (!b.weekdays?.length) throw bad('請選擇至少一個星期'); weekdays = [...new Set(b.weekdays.map(Number))].sort(); }
    else if (b.freq_type === 'interval') { interval_days = Number(b.interval_days); if (!Number.isInteger(interval_days) || interval_days < 2 || interval_days > 90) throw bad('間隔天數需介於 2 到 90'); }
    else if (b.freq_type !== 'daily') throw bad('頻率設定不正確');
    const start_date = b.start_date || today().date;
    if (!isDate(start_date)) throw bad('開始日期不正確');
    const end_date = b.end_date || null;
    if (end_date && (!isDate(end_date) || end_date < start_date)) throw bad('結束日期需晚於開始日期');
    const num = (v, l) => { if (v === '' || v == null) return null; const n = Number(v); if (!isFinite(n) || n < 0) throw bad(`${l}需為 0 以上的數字`); return n; };
    return { name, category: ['supplement', 'medicine', 'other'].includes(b.category) ? b.category : 'supplement', photo: b.photo || null,
      dose_amount: amt, dose_unit: String(b.dose_unit ?? '').trim().slice(0, 10), times, freq_type: b.freq_type, weekdays, interval_days,
      start_date, end_date, note: String(b.note ?? '').trim().slice(0, 100), notify: b.notify === undefined ? true : !!b.notify,
      stock: num(b.stock, '剩餘數量'), restock_threshold: num(b.restock_threshold, '補貨提醒數量') };
  }

  function dayView(date) {
    if (!isDate(date)) throw bad('日期不正確');
    const logs = db.logs.filter((l) => l.date === date);
    const now = Date.now();
    return { date, doses: dosesWithHistory(db.meds, date, logs).map(({ med, time, slot }) => {
      const l = logs.find((x) => x.med_id === med.id && x.time === time);
      const s = db.snoozes.find((x) => x.med_id === med.id && x.date === date && x.time === time && x.until > now);
      return { med: { ...pub(med), deleted: !!med.deleted_date }, time, slot, status: l ? l.status : null, taken_at: l ? l.taken_at : null, snooze_until: !l && s ? s.until : null };
    }) };
  }
  function assertScheduled(id, date, time) {
    if (!isDate(date) || !isTime(time)) throw bad('日期或時間不正確');
    const m = getMed(id, true);
    if (date > today().date) throw bad('還沒到的日子不能先打卡');
    const ok = (occursOn(m, date) && m.times.includes(time)) || db.logs.some((l) => l.med_id === m.id && l.date === date && l.time === time);
    if (!ok) throw bad('這一天沒有安排這個劑次');
    return m;
  }
  function setDose({ med_id, date, time, status, taken_at }) {
    const m = assertScheduled(med_id, date, time);
    const i = db.logs.findIndex((l) => l.med_id === m.id && l.date === date && l.time === time);
    const wasTaken = i >= 0 && db.logs[i].status === 'taken';
    if (i >= 0) db.logs.splice(i, 1);
    if (status) {
      let at = status === 'taken' ? (taken_at || null) : null;
      if (status === 'taken' && !at) { const n = today(); at = n.date === date ? `${String(Math.floor(n.minutes / 60)).padStart(2, '0')}:${String(n.minutes % 60).padStart(2, '0')}` : time; }
      db.logs.push({ med_id: m.id, date, time, status, taken_at: at });
    }
    db.snoozes = db.snoozes.filter((s) => !(s.med_id === m.id && s.date === date && s.time === time));
    const isTaken = status === 'taken';
    if (m.stock != null && m.dose_amount) {
      if (isTaken && !wasTaken) m.stock = Math.max(0, m.stock - m.dose_amount);
      if (!isTaken && wasTaken) m.stock += m.dose_amount;
    }
    return { ok: true, stock: m.stock, low_stock: pub(m).low_stock };
  }
  function calendar(month) {
    const t = today().date; const out = [];
    for (let d = `${month}-01`; d.startsWith(month); d = addDays(d, 1)) {
      const logs = db.logs.filter((l) => l.date === d);
      const doses = dosesWithHistory(db.meds, d, logs);
      let taken = 0, skipped = 0;
      for (const x of doses) { const l = logs.find((y) => y.med_id === x.med.id && y.time === x.time); if (l?.status === 'taken') taken++; else if (l?.status === 'skipped') skipped++; }
      out.push({ date: d, expected: doses.length, taken, skipped, unconfirmed: doses.length - taken - skipped, future: d > t });
    }
    return { month, today: t, days: out };
  }

  function handle(method, url, body) {
    const p = url.pathname, q = url.searchParams;
    const id = (p.match(/^\/api\/meds\/(\d+)/) || [])[1];
    if (p.startsWith('/api/auth/')) {
      if (p.endsWith('logout')) { db.loggedIn = false; return { ok: true }; }
      const email = String(body.email || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw bad('請輸入有效的 Email');
      if (String(body.password || '').length < 8) throw p.endsWith('login') ? new E(401, 'Email 或密碼不正確') : bad('密碼至少 8 個字元');
      db.loggedIn = true; db.user.email = email;
      if (body.display_name !== undefined) db.user.display_name = String(body.display_name).trim().slice(0, 20);
      return { ok: true };
    }
    if (p === '/api/push/public-key') throw new E(503, '預覽版沒有推播服務');
    if (!db.loggedIn) throw new E(401, '請先登入');
    if (p === '/api/me' && method === 'GET') { const n = today(); return { ...db.user, settings: db.settings, today: n.date, now_minutes: n.minutes, push_devices: 0 }; }
    if (p === '/api/me' && method === 'DELETE') { db = seed(); db.loggedIn = false; return { ok: true }; }
    if (p === '/api/settings') {
      for (const k of ['timezone', 'repeat_minutes', 'repeat_count']) if (body[k] !== undefined) db.settings[k] = body[k];
      if (body.hide_names !== undefined) db.settings.hide_names = body.hide_names ? 1 : 0;
      return db.settings;
    }
    if (p === '/api/meds' && method === 'GET') return db.meds.filter((m) => !m.deleted_date).sort((a, b) => (a.paused_since ? 1 : 0) - (b.paused_since ? 1 : 0) || a.times[0].localeCompare(b.times[0])).map(pub);
    if (p === '/api/meds' && method === 'POST') { const m = { id: db.nextId++, paused_since: null, deleted_date: null, ...validate(body) }; db.meds.push(m); return pub(m); }
    if (id && p.endsWith('/pause')) { const m = getMed(id); m.paused_since = body.paused ? (m.paused_since || today().date) : null; return pub(m); }
    if (id && method === 'GET') return pub(getMed(id));
    if (id && method === 'PATCH') { const m = getMed(id); Object.assign(m, validate({ ...pub(m), ...body })); return pub(m); }
    if (id && method === 'DELETE') {
      const m = getMed(id);
      if (!db.logs.some((l) => l.med_id === m.id) && m.start_date >= today().date) db.meds = db.meds.filter((x) => x !== m);
      else { m.deleted_date = today().date; m.photo = null; }
      return { ok: true };
    }
    if (p === '/api/day') return dayView(q.get('date') || today().date);
    if (p === '/api/doses') { if (body.status !== null && !['taken', 'skipped'].includes(body.status)) throw bad('狀態不正確'); return setDose(body); }
    if (p === '/api/doses/snooze') {
      const m = assertScheduled(body.med_id, body.date, body.time);
      if (db.logs.some((l) => l.med_id === m.id && l.date === body.date && l.time === body.time)) throw bad('這一劑已經有紀錄了');
      const until = Date.now() + Number(body.minutes) * 60000;
      db.snoozes = db.snoozes.filter((s) => !(s.med_id === m.id && s.date === body.date && s.time === body.time));
      db.snoozes.push({ med_id: m.id, date: body.date, time: body.time, until });
      return { ok: true, snooze_until: until };
    }
    if (p === '/api/calendar') return calendar(q.get('month') || today().date.slice(0, 7));
    if (p.startsWith('/api/push/')) throw new E(503, '這是預覽版，無法送出真正的通知');
    throw new E(404, '找不到這個功能');
  }

  window.fetch = async function (input, init = {}) {
    const url = new URL(typeof input === 'string' ? input : input.url, 'https://preview.local');
    const method = (init.method || 'GET').toUpperCase();
    let body = {};
    try { body = init.body ? JSON.parse(init.body) : {}; } catch { /* ignore */ }
    await new Promise((r) => setTimeout(r, 60));
    let status = 200, data;
    try { data = handle(method, url, body); if (method !== 'GET') save(); }
    catch (e) { status = e.status || 500; data = { error: e.message }; }
    return new Response(JSON.stringify(data), { status, headers: { 'content-type': 'application/json' } });
  };

  // 下載（CSV、行事曆）在預覽中無法使用
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="/api/"]');
    if (!a) return;
    e.preventDefault();
    window.__previewToast?.('預覽版無法下載檔案，正式版才可以');
  }, true);
})();
</script>

}

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'chile-ma' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error('目前無法連線，請確認網路後再試一次');
  }
  const data = (res.headers.get('content-type') || '').includes('json') ? await res.json() : null;
  if (res.status === 401 && !path.startsWith('/api/auth/')) { state.me = null; renderAuth(); throw new Error('登入已過期，請重新登入'); }
  if (!res.ok) throw new Error(data?.error || '發生錯誤，請稍後再試');
  return data;
}

function toast(msg, { error = false, action, onAction, ms = 2600 } = {}) {
  const wrap = $('#toasts');
  wrap.innerHTML = `<div class="toast ${error ? 'err' : ''}" role="status">${esc(msg)}${action ? `<button class="btn">${esc(action)}</button>` : ''}</div>`;
  const el = wrap.firstElementChild;
  if (action) el.querySelector('button').onclick = () => { wrap.innerHTML = ''; onAction(); };
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { if (wrap.firstElementChild === el) wrap.innerHTML = ''; }, action ? 5000 : ms);
}
window.__previewToast = (m) => toast(m);
const fail = (e) => toast(e.message || String(e), { error: true });

// ---------- 插畫 ----------

// 今日小芽：依完成比例長大（0 → 種子，1 → 開花）
function sproutSVG(ratio, animate) {
  const stage = ratio >= 1 ? 4 : ratio >= 0.67 ? 3 : ratio >= 0.34 ? 2 : ratio > 0 ? 1 : 0;
  const g = animate ? 'class="grow"' : '';

  const leaf1 = stage >= 1 ? '<path d="M56 74c-2-9-10-13-18-12 1 8 8 13 18 12Z" fill="#9DBB96"/>' : '';

  const leaf3 = stage >= 3 ? '<path d="M56 54c-1-7-7-10-13-9 1 6 6 10 13 9Z" fill="#AFC9A8"/>' : '';

  const seed = stage === 0 ? '<ellipse cx="56" cy="85" rx="5" ry="3.5" fill="#B9A27A"/><path d="M56 82c0-3 1.5-5 3.5-6" stroke="#9DBB96" stroke-width="2" stroke-linecap="round" fill="none"/>' : '';

function thumb(m, cls = '') {

}

// ---------- 首頁 ----------
function greeting(min) {
  const name = state.me.display_name ? `，${state.me.display_name}` : '';

  if (min < 660) return `早安${name}`;
  if (min < 1080) return `午安${name}`;
  return `晚安${name}`;
}

function doseStatus(d, now) {
  if (d.status === 'taken') return 'taken';
  if (d.status === 'skipped') return 'skipped';
  if (d.snooze_until && d.snooze_until > Date.now()) return 'snoozed';
  if (state.day.date < now.date || (state.day.date === now.date && toMin(d.time) <= now.minutes)) return 'due';
  return 'upcoming';
}

function doseCard(d, now) {
  const st = doseStatus(d, now);
  const k = `data-med="${d.med.id}" data-time="${d.time}"`;
  const meta = [doseText(d.med), d.med.note].filter(Boolean).map(esc).join('<span aria-hidden="true">·</span>');
  let bottom;
  if (st === 'taken') bottom = `<div class="dose-status"><span>✓ 已服用 ${esc(d.taken_at || '')}</span><button class="btn btn-ghost" data-act="edit" ${k}>更改</button></div>`;
  else if (st === 'skipped') bottom = `<div class="dose-status"><span>這次略過了</span><button class="btn btn-ghost" data-act="edit" ${k}>更改</button></div>`;
  else bottom = `${st === 'snoozed' ? `<div class="dose-status"><span>⏰ ${fmtClock(d.snooze_until)} 再提醒你</span></div>` : ''}
    <div class="dose-actions">
      <button class="btn btn-primary" data-act="take" ${k}>已服用</button>
      <button class="btn btn-soft" data-act="snooze" ${k}>稍後提醒</button>
      <button class="btn btn-ghost" data-act="skip" ${k}>略過</button>
    </div>`;
  return `<article class="dose is-${st}">
    ${thumb(d.med)}
    <div><div class="dose-name">${esc(d.med.name)}</div>
      <div class="dose-meta">${meta}${d.med.low_stock ? '<span class="tag blush">快用完了</span>' : ''}${d.med.deleted ? '<span class="tag mute">已刪除</span>' : ''}</div></div>
    <div class="dose-time">${st === 'due' ? `<span class="due">${esc(d.time)}</span>` : esc(d.time)}</div>

  </article>`;
}

async function loadDay(date) {
  state.day = await api('GET', `/api/day?date=${date}`);
}

function renderToday({ animate = false } = {}) {
  const now = localNow();
  const day = state.day;
  const doses = day.doses;
  const done = doses.filter((d) => d.status).length;
  const taken = doses.filter((d) => d.status === 'taken').length;
  const ratio = doses.length ? done / doses.length : 0;
  const isToday = day.date === now.date;
  const pending = doses.filter((d) => !d.status).length;

  let head;
  if (!doses.length) head = '';
  else if (done === doses.length) head = `<h2>今天的小花開了 🌷</h2><p>所有項目都確認完成</p>`;
  else if (done === 0) head = `<h2>今天有 ${doses.length} 個小任務</h2><p>每完成一個，小芽就長大一點</p>`;
  else head = `<h2>再 ${pending} 個就完成了</h2><p>小芽正在慢慢長大</p>`;

  const sections = SLOTS.map((s) => {
    const list = doses.filter((d) => d.slot === s.id);
    if (!list.length) return '';
    return `<section class="slot slot-${s.id}" aria-label="${s.label}">
      <div class="slot-head"><span class="slot-ico">${ICON.slot[s.id]}</span><h3>${s.label}</h3>
      <span class="count">${list.filter((d) => d.status).length} / ${list.length}</span></div>
      ${list.map((d) => doseCard(d, now)).join('')}
    </section>`;
  }).join('');

  const banners = [];
  const p = pushSupport();
  if (state.meds.some((m) => m.notify && !m.paused) && !p.subscribed) {
    banners.push(`<div class="banner"><div><b>開啟提醒通知</b>時間到了，手機會提醒你</div><button class="btn" data-act="push-guide">設定</button></div>`);
  }

    banners.push(`<div class="banner sage"><div><b>你好像換了時區</b>目前提醒依「${esc(state.me.settings.timezone)}」，要改成「${esc(devTz)}」嗎？</div><button class="btn" data-act="tz-update" data-tz="${esc(devTz)}">更新</button></div>`);
  }

  const body = !state.meds.length && !doses.length
    ? `<div class="empty">${potEmpty}<h2>種下第一顆小種子</h2><p>把每天要吃的保健食品或藥物加進來，<br>時間到了就會提醒你。</p><a class="btn btn-primary" href="#/items?new=1">${ICON.plus.replace('<svg', '<svg width="18" height="18"')}新增項目</a></div>`

      : `<div class="card sprout-card">${sproutSVG(ratio, animate)}<div>${head}</div>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${doses.length}" aria-valuenow="${done}" aria-label="今日完成進度"><span style="width:${Math.round(ratio * 100)}%"></span></div>
          <div class="progress-meta"><span>已確認 ${done} / ${doses.length}</span><span>已服用 ${taken}</span></div></div>
        ${sections}`;

  root.innerHTML = shell('today', `
    <header class="topbar"><div><p class="sub">${fmtDate(day.date)}</p><h1>${isToday ? greeting(now.minutes) : '回顧這一天'}</h1></div>
      ${!isToday ? `<a class="btn btn-soft" href="#/today">回到今天</a>` : ''}</header>

}

let sessionStore = {};
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch { return sessionStore[k]; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch { sessionStore[k] = v; } }

function findDose(medId, time) { return state.day.doses.find((d) => d.med.id === medId && d.time === time); }

async function setDose(medId, time, status, taken_at, { quiet = false } = {}) {
  const prev = findDose(medId, time);
  const before = prev ? { status: prev.status, taken_at: prev.taken_at } : null;
  const r = await api('POST', '/api/doses', { med_id: medId, date: state.day.date, time, status, taken_at });
  await loadDay(state.day.date);
  rerender(true);
  closeNotificationsFor(state.day.date, time);
  if (!quiet) {
    const msg = status === 'taken' ? pick(SMALL_CHEERS) : status === 'skipped' ? '已記下這次略過' : '已清除紀錄';
    toast(r.low_stock && status === 'taken' ? `${msg}・剩餘數量不多了，記得補貨` : msg, {
      action: '復原', onAction: () => setDose(medId, time, before?.status ?? null, before?.taken_at, { quiet: true }).catch(fail),
    });
  }
  maybeCelebrate();
}

function maybeCelebrate() {
  const now = localNow();
  const d = state.day;
  if (d.date !== now.date || !d.doses.length) return;
  const complete = d.doses.every((x) => x.status) && d.doses.some((x) => x.status === 'taken');
  if (complete && state.lastComplete === false) celebrate();
  state.lastComplete = complete;
}

function celebrate() {
  const el = document.createElement('div');
  el.className = 'celebrate';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', '今日完成');
  el.innerHTML = `<div class="celebrate-inner">
    <svg viewBox="0 0 200 200" aria-hidden="true"><g class="float">
      <path d="M100 178V100" stroke="#6F8F69" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 150c-4-18-20-26-36-24 2 17 17 26 36 24Z" fill="#9DBB96"/><path d="M100 134c4-19 21-27 38-24-2 18-18 27-38 24Z" fill="#8FA98A"/>
      <g class="petals">${[0, 60, 120, 180, 240, 300].map((r, i) => `<ellipse cx="100" cy="70" rx="14" ry="22" fill="${i % 2 ? '#F2CBC5' : '#F6D9D4'}" transform="rotate(${r} 100 92)"/>`).join('')}</g>
      <circle cx="100" cy="92" r="13" fill="#E9CB8B"/></g>
      <circle class="spark" style="animation-delay:.5s" cx="40" cy="60" r="5" fill="#E9CB8B"/><circle class="spark" style="animation-delay:.7s" cx="166" cy="48" r="4" fill="#F2CBC5"/><circle class="spark" style="animation-delay:.9s" cx="160" cy="120" r="5" fill="#9DBB96"/>
    </svg>
    <h2>今天完成了！</h2><p>${esc(pick(CHEERS))}</p>
    <button class="btn btn-primary btn-block">好的</button></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('button').onclick = close;
  el.querySelector('button').focus();
  el.addEventListener('click', (e) => { if (e.target === el) close(); });
}

function onDoseClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const medId = Number(b.dataset.med), time = b.dataset.time;
  const act = b.dataset.act;
  if (act === 'take') setDose(medId, time, 'taken').catch(fail);
  else if (act === 'skip') setDose(medId, time, 'skipped').catch(fail);
  else if (act === 'snooze') snoozeSheet(medId, time);
  else if (act === 'edit') editDoseSheet(medId, time);
  else if (act === 'push-guide') pushGuideSheet();
  else if (act === 'tz-update') {
    api('PATCH', '/api/settings', { timezone: b.dataset.tz }).then((s) => { state.me.settings = s; toast('已更新時區'); route(); }).catch(fail);
  }
}

function snoozeSheet(medId, time) {
  const d = findDose(medId, time);
  const now = localNow();
  if (state.day.date !== now.date) return toast('稍後提醒只適用於今天的項目', { error: true });
  openSheet(`${esc(d.med.name)}・稍後提醒`, `<div class="action-list">
    ${[10, 30, 60].map((m) => `<button class="btn btn-soft" data-min="${m}">${m === 60 ? '1 小時' : m + ' 分鐘'}後提醒我</button>`).join('')}
  </div><p class="note-soft">${pushSupport().subscribed ? '時間到了會再推播通知你。' : '尚未開啟通知：到時請回到 App 查看。'}</p>`, (sheet, close) => {
    sheet.querySelectorAll('[data-min]').forEach((b) => b.onclick = async () => {
      try {
        await api('POST', '/api/doses/snooze', { med_id: medId, date: state.day.date, time, minutes: Number(b.dataset.min) });
        close(); await loadDay(state.day.date); rerender(); toast('好的，等等提醒你');
      } catch (e) { fail(e); }
    });
  });
}

function editDoseSheet(medId, time, after, dayObj = state.day) {
  const d = dayObj.doses.find((x) => x.med.id === medId && x.time === time);
  if (!d) return;
  const dayDate = dayObj.date;
  openSheet(`${esc(d.med.name)}・${esc(d.time)}`, `
    <p class="note-soft" style="margin-top:0">${fmtDate(dayDate)}${d.status ? '' : '・尚未記錄'}</p>
    <div class="field"><label for="ta">實際服用時間</label><input class="input" type="time" id="ta" value="${esc(d.taken_at || d.time)}"></div>
    <div class="action-list">
      <button class="btn btn-primary" data-s="taken">${d.status === 'taken' ? '更新服用時間' : '記錄為已服用'}</button>
      ${d.status !== 'skipped' ? '<button class="btn btn-soft" data-s="skipped">記錄為略過</button>' : ''}
      ${d.status ? '<button class="btn btn-blush" data-s="clear">清除紀錄（改回未確認）</button>' : ''}
    </div>
    <p class="note-soft">補登只會更新紀錄，不會重複計算，也不會影響之後的提醒。</p>`, (sheet, close) => {
    sheet.querySelectorAll('[data-s]').forEach((b) => b.onclick = async () => {
      const s = b.dataset.s === 'clear' ? null : b.dataset.s;
      const ta = $('#ta', sheet).value || null;
      try {
        await api('POST', '/api/doses', { med_id: medId, date: dayDate, time, status: s, taken_at: s === 'taken' ? ta : null });
        close();
        closeNotificationsFor(dayDate, time);
        if (state.day && state.day.date === dayDate) await loadDay(dayDate);
        toast('已更新紀錄');
        if (after) after(); else { rerender(); maybeCelebrate(); }
      } catch (e) { fail(e); }
    });
  });
}

// ---------- 底部抽屜 ----------
function openSheet(title, body, setup, foot = '') {
  const prevFocus = document.activeElement;
  const back = document.createElement('div');
  back.className = 'sheet-backdrop';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = `<div class="sheet-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="關閉">${ICON.close}</button></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
  document.body.append(back, sheet);
  document.body.style.overflow = 'hidden';
  const close = () => { back.remove(); sheet.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); prevFocus?.focus?.(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.onclick = close;
  sheet.querySelector('[data-close]').onclick = close;
  setup?.(sheet, close);
  setTimeout(() => (sheet.querySelector('input:not([type=file]), button:not([data-close])') || sheet).focus?.(), 50);
  return { sheet, close };
}

function confirmSheet(title, text, okLabel, onOk, danger = true) {
  openSheet(esc(title), `<p style="margin:0 0 18px">${esc(text)}</p>`, (s, close) => {
    s.querySelector('[data-ok]').onclick = async () => { try { await onOk(); close(); } catch (e) { fail(e); } };
    s.querySelector('[data-cancel]').onclick = close;
  }, `<button class="btn btn-soft" data-cancel>取消</button><button class="btn ${danger ? 'btn-blush' : 'btn-primary'}" data-ok>${esc(okLabel)}</button>`);
}

// ---------- 日曆 ----------
function ringSVG(day) {
  if (day.future || !day.expected) return day.expected ? '<span class="ring-dot"><i></i></span>' : '<span class="ring-dot"></span>';
  const r = 9, c = 2 * Math.PI * r;
  const t = day.taken / day.expected, s = day.skipped / day.expected;
  if (day.taken === day.expected) {
    return '<svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#8FA98A"/><path d="m6.8 11.3 2.8 2.7 5.6-5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  return `<svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="${r}" fill="none" stroke="#ECE6D9" stroke-width="3"/>
    <circle cx="11" cy="11" r="${r}" fill="none" stroke="#8FA98A" stroke-width="3" stroke-dasharray="${t * c} ${c}" transform="rotate(-90 11 11)" stroke-linecap="round"/>
    ${s ? `<circle cx="11" cy="11" r="${r}" fill="none" stroke="#E9CB8B" stroke-width="3" stroke-dasharray="0 ${t * c} ${s * c} ${c}" transform="rotate(-90 11 11)"/>` : ''}</svg>`;
}

async function renderCalendar() {
  const now = localNow();
  if (!state.calMonth) state.calMonth = now.date.slice(0, 7);
  state.cal = await api('GET', `/api/calendar?month=${state.calMonth}`);
  const days = state.cal.days;
  const firstDow = new Date(days[0].date + 'T00:00:00Z').getUTCDay();
  const [y, m] = state.calMonth.split('-').map(Number);
  const past = days.filter((d) => !d.future && d.expected);
  const sum = past.reduce((a, d) => ({ e: a.e + d.expected, t: a.t + d.taken, s: a.s + d.skipped }), { e: 0, t: 0, s: 0 });
  const fullDays = past.filter((d) => d.taken + d.skipped === d.expected && d.taken > 0).length;

  root.innerHTML = shell('calendar', `
    <header class="topbar"><div><p class="sub">打卡日曆</p><h1>每一天的小紀錄</h1></div></header>
    <div class="card" style="margin-top:14px">
      <div class="cal-head" style="margin-top:0">
        <button class="icon-btn" data-nav="-1" aria-label="上個月">${ICON.left}</button>
        <h2>${y} 年 ${m} 月</h2>
        <button class="icon-btn" data-nav="1" aria-label="下個月">${ICON.right}</button>
      </div>
      <div class="cal-grid">
        ${WEEK.map((w) => `<div class="cal-dow">${w}</div>`).join('')}
        ${'<div></div>'.repeat(firstDow)}
        ${days.map((d) => `<button class="cal-day ${d.date === now.date ? 'today' : ''}" data-date="${d.date}" ${d.future ? 'disabled' : ''}
          aria-label="${fmtDate(d.date)}，${d.expected ? `已服用 ${d.taken}，略過 ${d.skipped}，未確認 ${d.unconfirmed}` : '沒有安排'}">
          <span>${Number(d.date.slice(8))}</span>${ringSVG(d)}</button>`).join('')}
      </div>
      <div class="legend">
        <span><i class="lg" style="background:#8FA98A"></i>已服用</span>
        <span><i class="lg" style="background:#E9CB8B"></i>略過</span>
        <span><i class="lg" style="background:#ECE6D9"></i>未確認</span>
      </div>
    </div>
    <div class="month-sum">
      <div class="stat"><b>${sum.e ? Math.round((sum.t / sum.e) * 100) : 0}%</b><small>本月服用率</small></div>
      <div class="stat"><b>${fullDays}</b><small>全部完成的天數</small></div>
      <div class="stat"><b>${sum.e - sum.t - sum.s}</b><small>未確認</small></div>
    </div>
    <p class="note-soft">「未確認」只代表那次沒有打卡，不代表你沒有服用。想起來的話，點日期就能補登。</p>`);

  const main = $('#main');
  main.onclick = (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const d = new Date(Date.UTC(y, m - 1 + Number(nav.dataset.nav), 1));
      state.calMonth = d.toISOString().slice(0, 7);
      return renderCalendar().catch(fail);
    }
    const cell = e.target.closest('[data-date]');
    if (cell) dayDetailSheet(cell.dataset.date);
  };
}

async function dayDetailSheet(date) {
  let view;
  try { view = await api('GET', `/api/day?date=${date}`); } catch (e) { return fail(e); }
  const label = { taken: '已服用', skipped: '略過' };
  const body = view.doses.length ? view.doses.map((d) => `
    <button class="card item" data-med="${d.med.id}" data-time="${d.time}" style="padding:12px">
      ${thumb(d.med)}
      <div><div class="dose-name">${esc(d.med.name)}</div>
        <div class="dose-meta"><span>預定 ${esc(d.time)}</span>${d.status === 'taken' && d.taken_at ? `<span>實際 ${esc(d.taken_at)}</span>` : ''}</div></div>
      <span class="tag ${d.status === 'taken' ? '' : d.status === 'skipped' ? 'mute' : 'blush'}" style="${d.status === 'taken' ? 'background:var(--sage-soft);color:var(--sage-deep)' : ''}">${label[d.status] || '未確認'}</span>
    </button>`).join('') + '<p class="note-soft">點一下項目即可補登或修改。</p>'
    : '<p class="note-soft" style="margin-top:0">這天沒有安排項目。</p>';
  const { close } = openSheet(fmtDate(date), body, (sheet, close) => {
    sheet.querySelector('.sheet-body').onclick = (e) => {
      const b = e.target.closest('[data-med]');
      if (!b) return;
      close();
      editDoseSheet(Number(b.dataset.med), b.dataset.time, () => { renderCalendar().then(() => dayDetailSheet(date)).catch(fail); }, view);
    };
  });
  return close;
}

async function resizeImage(file) {
  if (!/^image\//.test(file.type)) throw new Error('請選擇圖片檔');
  const bmp = await createImageBitmap(file).catch(() => null);
  const img = bmp || await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('無法讀取這張圖片')); i.src = URL.createObjectURL(file); });
  const size = 320;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const w = img.width, h = img.height, s = Math.min(w, h);
  c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.82);
}

    $('#times', sheet).onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) { v.times.splice(Number(b.dataset.rm), 1); drawTimes(); } };
    $('#addtime', sheet).onclick = () => {

    const save = async () => {
      const payload = {

        dose_amount: $('#amt', sheet).value, dose_unit: $('#unit', sheet).value,
        times: v.times.filter(Boolean), freq_type: v.freq_type, weekdays: v.weekdays,
        interval_days: Number($('#iv', sheet)?.value || v.interval_days),

      const err = $('#ferr', sheet);
      err.textContent = '';
      const btn = sheet.querySelector('[data-save]');
      btn.disabled = true;
      try {
        if (isEdit) await api('PATCH', `/api/meds/${med.id}`, payload);

        close();

    sheet.querySelector('[data-save]').onclick = save;
    if (isEdit) {
      $('#pause', sheet).onclick = async () => {
        try {
          await api('POST', `/api/meds/${med.id}/pause`, { paused: !med.paused });

        } catch (e) { fail(e); }

        await api('DELETE', `/api/meds/${med.id}`); toast('已刪除'); await refreshData(); route();

  }, `<button class="btn btn-soft" data-close-foot>取消</button><button class="btn btn-primary" data-save>${isEdit ? '儲存' : '新增'}</button>`);
  const foot = document.querySelector('[data-close-foot]');

// ---------- 推播通知 ----------
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushState = { subscribed: false, endpoint: null, error: null };

function pushSupport() {
  const checks = [
    { ok: window.isSecureContext, label: '使用安全連線（HTTPS）', fix: '請用 https:// 開頭的網址開啟' },
    { ok: 'serviceWorker' in navigator, label: '瀏覽器支援背景程式（Service Worker）', fix: '請改用最新版 Chrome、Safari、Edge 或 Firefox' },
    { ok: 'PushManager' in window && 'Notification' in window, label: '瀏覽器支援推播通知', fix: isIOS() ? (isStandalone() ? '需要 iOS 16.4 以上，請更新系統' : '在 iPhone 上，需要先「加入主畫面」再從主畫面開啟') : '這個瀏覽器不支援推播，請改用 Chrome、Edge、Firefox 或 Safari' },
  ];
  if (isIOS()) checks.splice(2, 0, { ok: isStandalone(), label: '已從主畫面開啟（iPhone 必要條件）', fix: '請依下方步驟加入主畫面，再從主畫面的圖示開啟' });
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  checks.push({ ok: perm === 'granted', label: '已允許通知權限', fix: perm === 'denied' ? '你先前選擇了「不允許」，需要到系統或瀏覽器設定中重新允許（見下方說明）' : '按下方「開啟通知」並選擇「允許」' });
  checks.push({ ok: pushState.subscribed, label: '這台裝置已登記接收提醒', fix: pushState.error || '按下方「開啟通知」' });
  return { checks, perm, subscribed: pushState.subscribed, canTry: checks.slice(0, isIOS() ? 4 : 3).every((c) => c.ok) && perm !== 'denied' };
}

function b64ToBytes(b64) { const s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (b64.length % 4)) % 4)); return Uint8Array.from(s, (c) => c.charCodeAt(0)); }

const swReady = (ms = 4000) => Promise.race([
  navigator.serviceWorker.ready,
  new Promise((_, rej) => setTimeout(() => rej(new Error('背景程式（Service Worker）尚未啟動，請重新整理頁面')), ms)),
]);

async function syncPushState() { return;
  pushState.subscribed = false;
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !window.isSecureContext) return;
  try {
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === 'granted') {
      const { publicKey } = await api('GET', '/api/push/public-key');
      const cur = sub.options?.applicationServerKey ? btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : publicKey;
      if (cur !== publicKey) { await sub.unsubscribe(); return; } // 伺服器金鑰換了 → 需重新訂閱
      await api('POST', '/api/push/subscribe', sub.toJSON()); // 確保伺服器端與此裝置同步（例如換帳號登入）
      pushState.subscribed = true; pushState.endpoint = sub.endpoint;
    }
  } catch (e) { pushState.error = e.message; }
}

async function enablePush() { throw new Error('這是預覽版，無法開啟真正的通知。部署到正式網址後就能使用。');
  const s = pushSupport();
  if (!s.canTry) throw new Error(s.checks.find((c) => !c.ok)?.fix || '這台裝置目前無法開啟通知');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? '你選擇了不允許通知。需要提醒的話，請到設定中重新允許。' : '還沒有允許通知');
  const reg = await swReady(10000);
  const { publicKey } = await api('GET', '/api/push/public-key');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) }); }
    catch (e) { pushState.error = '推播服務登記失敗：' + (e.message || e.name); throw new Error(pushState.error); }
  }
  await api('POST', '/api/push/subscribe', sub.toJSON());
  pushState.subscribed = true; pushState.endpoint = sub.endpoint; pushState.error = null;
}

async function disablePush() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await swReady();
  const sub = await reg.pushManager.getSubscription();
  if (sub) { await api('POST', '/api/push/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
  pushState.subscribed = false;
}

    ${deniedHelp}

    <h3 style="font-size:15px;margin:22px 0 4px">無法開啟通知的話</h3>
    <p class="note-soft" style="margin-top:0">可以把提醒匯入手機行事曆（內含鬧鐘提示），或每天打開 App 查看「今天」頁面。</p>
    <a class="btn btn-soft btn-block" href="/api/reminders.ics" download>下載行事曆提醒（.ics）</a>`, (sheet, close) => {
    const err = $('#perr', sheet);
    const on = $('#pon', sheet);
    if (on) on.onclick = async () => {

    };
  });
}

async function closeNotificationsFor(date, time) {
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    const list = await reg?.getNotifications({ tag: `dose-${date}-${time}` });
    const stillPending = state.day?.date === date && state.day.doses.some((d) => d.time === time && !d.status);
    if (!stillPending) list?.forEach((n) => n.close());
  } catch { /* 不支援時略過 */ }
}

  const s = pushSupport();
  const devTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const zones = [...new Set([st.timezone, devTz, 'Asia/Taipei', 'Asia/Hong_Kong', 'Asia/Macau', 'Asia/Shanghai', 'Asia/Singapore', 'Asia/Tokyo', 'Asia/Seoul', 'Australia/Sydney', 'Europe/London', 'America/Los_Angeles', 'America/New_York'].filter(Boolean))];

        <div class="row" style="margin-top:8px"><input class="input" type="date" id="exf" value="${addDays(today, -29)}" aria-label="開始日期"><input class="input" type="date" id="ext" value="${today}" aria-label="結束日期"></div>

function deleteAccountSheet() {
  openSheet('永久刪除帳號', `<p style="margin-top:0">所有項目、照片、打卡紀錄與通知設定都會被永久刪除，無法復原。</p>
    <div class="field"><label for="dpw">輸入密碼確認</label><input class="input" type="password" id="dpw" autocomplete="current-password"></div>
    <p class="form-error" id="derr" role="alert"></p>`, (s, close) => {
    s.querySelector('[data-ok]').onclick = async () => {
      try {
        await disablePush().catch(() => {});
        await api('DELETE', '/api/me', { password: $('#dpw', s).value });
        close(); state.me = null; renderAuth(); toast('帳號已刪除');
      } catch (e) { $('#derr', s).textContent = e.message; }
    };
    s.querySelector('[data-cancel]').onclick = close;
  }, '<button class="btn btn-soft" data-cancel>取消</button><button class="btn btn-blush" data-ok>永久刪除</button>');
}

// ---------- 登入／註冊 ----------
function renderAuth(mode = 'login') {
  root.innerHTML = `<main class="auth view">
    <div class="auth-hero">${potEmpty}<h1>今天吃了嗎？</h1><p>溫柔提醒，陪你養成照顧自己的習慣</p></div>
    <div class="seg" id="amode" style="margin-bottom:18px">
      <button type="button" data-m="login" aria-pressed="${mode === 'login'}">登入</button>
      <button type="button" data-m="register" aria-pressed="${mode === 'register'}">建立帳號</button></div>
    <form id="authf" novalidate>
      ${mode === 'register' ? '<div class="field"><label for="dn">怎麼稱呼你（選填）</label><input class="input" id="dn" maxlength="20" autocomplete="nickname"></div>' : ''}
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="pw">密碼</label><input class="input" id="pw" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" minlength="8" required>
        ${mode === 'register' ? '<p class="hint">至少 8 個字元</p>' : ''}</div>
      <p class="form-error" id="aerr" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">${mode === 'login' ? '登入' : '建立帳號'}</button>
    </form>
    <p class="privacy-note">你的保健與用藥紀錄只屬於你，<br>其他使用者無法看到。</p>
  </main><div id="toasts" class="toast-wrap"></div>`;
  $('#amode').onclick = (e) => { const b = e.target.closest('[data-m]'); if (b) renderAuth(b.dataset.m); };
  $('#authf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const body = { email: $('#em').value, password: $('#pw').value };
      if (mode === 'register') Object.assign(body, { display_name: $('#dn').value, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone });
      await api('POST', `/api/auth/${mode}`, body);
      await boot();
    } catch (err) { $('#aerr').textContent = err.message; btn.disabled = false; }
  };
}

// ---------- 路由 ----------
async function refreshMe() { state.me = await api('GET', '/api/me'); }
async function refreshData() { [state.meds] = await Promise.all([api('GET', '/api/meds'), refreshMe()]); }

function ensureToasts() { if (!$('#toasts')) document.body.insertAdjacentHTML('beforeend', '<div id="toasts" class="toast-wrap"></div>'); }

function rerender(animate) {
  const tab = (location.hash.slice(2) || 'today').split('?')[0];
  if (tab === 'today' && state.day) renderToday({ animate });
}

async function route() {
  if (!state.me) return;
  ensureToasts();
  const [tab, qs] = (location.hash.slice(2) || 'today').split('?');
  const params = new URLSearchParams(qs || '');
  try {
    if (tab === 'calendar') await renderCalendar();
    else if (tab === 'items') { renderItems(); if (params.get('new')) { history.replaceState(null, '', '#/items'); medForm(); } }
    else if (tab === 'settings') renderSettings();
    else {
      const date = params.get('date') && params.get('date') <= localNow().date ? params.get('date') : localNow().date;
      await loadDay(date);
      state.lastComplete = state.day.doses.length ? state.day.doses.every((d) => d.status) && state.day.doses.some((d) => d.status === 'taken') : null;
      renderToday();
    }
    window.scrollTo(0, 0);
  } catch (e) { fail(e); }
}

async function boot() {
  try {
    await refreshData();
  } catch (e) {
    if (!state.me) { if (!/登入/.test(e.message)) renderAuthWithError(e); return; }
  }
  // 從通知點進來：/?date=YYYY-MM-DD
  const qd = new URLSearchParams(location.search).get('date');
  if (qd) { history.replaceState(null, '', `/#/today?date=${qd}`); }
  await syncPushState();
  route();
}

function renderAuthWithError(e) {
  root.innerHTML = `<main class="auth"><div class="empty">${potEmpty}<h2>暫時連不上</h2><p>${esc(e.message)}</p><button class="btn btn-primary" id="retry">重新連線</button></div></main>`;
  $('#retry').onclick = boot;
}

window.addEventListener('hashchange', route);
// 回到 App 時更新（例如跨過午夜、或從通知按了「已服用」）
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.me && !document.querySelector('.sheet')) route(); });
navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data?.type === 'doses-updated' && state.me) route(); });

if (false) navigator.serviceWorker.register('/sw.js').catch((e) => { pushState.error = 'Service Worker 註冊失敗：' + e.message; });
boot();
</script>
</body>
</html>
